<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <!-- 渐变背景 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18100b"/>
      <stop offset="50%" stop-color="#2a1b13"/>
      <stop offset="100%" stop-color="#140c08"/>
    </linearGradient>

    <!-- 卡片玻璃质感渐变 -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b261a" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#241710" stop-opacity="0.95"/>
    </linearGradient>

    <!-- 金色高光渐变 -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f6d365"/>
      <stop offset="50%" stop-color="#fda085"/>
      <stop offset="100%" stop-color="#f6d365"/>
    </linearGradient>

    <linearGradient id="accentGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#aa7c11"/>
    </linearGradient>

    <!-- 投影 -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .title-en { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 900; fill: #ffffff; letter-spacing: -1px; }
    .title-cn { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-weight: 900; fill: url(#goldGrad); }
    .sub { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; fill: #e7d8bf; font-weight: 500; }
    .desc { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; fill: #a58667; font-size: 16px; }
    .badge-txt { font-family: -apple-system, sans-serif; font-size: 13px; font-weight: 700; fill: #f4ede1; }
    .tag { font-family: "PingFang SC", sans-serif; font-size: 14px; font-weight: 600; fill: #d4af37; }
  </style>

  <!-- 背景 -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- 背景装饰光晕与暗纹网格 -->
  <circle cx="200" cy="150" r="280" fill="#c6a172" opacity="0.08" filter="url(#glow)"/>
  <circle cx="1000" cy="450" r="320" fill="#a62420" opacity="0.07" filter="url(#glow)"/>

  <!-- 边框暗金线 -->
  <rect x="24" y="24" width="1152" height="582" rx="20" fill="none" stroke="#5f412d" stroke-width="1.5" stroke-opacity="0.5"/>
  <rect x="32" y="32" width="1136" height="566" rx="16" fill="none" stroke="#aa7c11" stroke-width="1" stroke-opacity="0.2"/>

  <!-- 左上角标识 -->
  <g transform="translate(60, 65)">
    <rect width="36" height="36" rx="8" fill="#432e22" stroke="#7c5435" stroke-width="1"/>
    <text x="18" y="25" font-size="20" text-anchor="middle">🌰</text>
    <text x="48" y="23" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#c6a172" letter-spacing="1">BIG PLAYER · OPEN SOURCE GAME</text>
  </g>

  <!-- 左侧主标题区 -->
  <g transform="translate(60, 160)">
    <!-- 英文大标题 -->
    <text x="0" y="55" class="title-en" font-size="64">Big Player</text>
    <!-- 中文大标题 -->
    <text x="350" y="55" class="title-cn" font-size="56">我是大收藏家</text>

    <!-- 核心 Slogan 问句 -->
    <text x="0" y="115" class="sub" font-size="28" font-weight="700">
      你种下的不是核桃，是下一件国宝。
    </text>
    <text x="0" y="148" class="desc" font-size="17">
      从荒山台地到传世私博 —— 把一棵核桃树，种成一件国宝。
    </text>

    <!-- 4个小特色 Pill -->
    <g transform="translate(0, 195)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="130" height="42" rx="10" fill="#251a14" stroke="#5f412d" stroke-width="1.2"/>
        <text x="18" y="26" font-size="16">⛰️</text>
        <text x="44" y="26" class="badge-txt">台地解谜</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(145, 0)">
        <rect width="130" height="42" rx="10" fill="#251a14" stroke="#5f412d" stroke-width="1.2"/>
        <text x="18" y="26" font-size="16">🔨</text>
        <text x="44" y="26" class="badge-txt">物理开核</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(290, 0)">
        <rect width="130" height="42" rx="10" fill="#251a14" stroke="#5f412d" stroke-width="1.2"/>
        <text x="18" y="26" font-size="16">📦</text>
        <text x="44" y="26" class="badge-txt">五维配对</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(435, 0)">
        <rect width="130" height="42" rx="10" fill="#251a14" stroke="#5f412d" stroke-width="1.2"/>
        <text x="18" y="26" font-size="16">🏛️</text>
        <text x="44" y="26" class="badge-txt">国宝私博</text>
      </g>
    </g>
  </g>

  <!-- 右侧 UI 与生态流程模拟图示 (玻璃拟态卡片) -->
  <g transform="translate(680, 80)" filter="url(#shadow)">
    <!-- 卡片底板 -->
    <rect width="460" height="360" rx="18" fill="url(#cardGrad)" stroke="#7c5435" stroke-width="1.5"/>

    <!-- 顶部窗体栏 -->
    <rect width="460" height="40" rx="18" fill="#1f140e" stroke="#5f412d" stroke-width="1"/>
    <rect x="0" y="25" width="460" height="15" fill="#1f140e"/>
    <circle cx="24" cy="20" r="5" fill="#ef4444"/>
    <circle cx="40" cy="20" r="5" fill="#f59e0b"/>
    <circle cx="56" cy="20" r="5" fill="#10b981"/>
    <text x="440" y="25" text-anchor="end" font-family="-apple-system, sans-serif" font-size="12" fill="#a58667">Game Loop &amp; Architecture</text>

    <!-- 卡片内部流程图 -->
    <g transform="translate(25, 60)">
      <!-- Step 1: 选地种植 -->
      <g transform="translate(0, 0)">
        <rect width="190" height="110" rx="12" fill="#1a110c" stroke="#5f412d" stroke-width="1"/>
        <text x="15" y="30" font-size="18">🌱</text>
        <text x="42" y="30" font-family="PingFang SC, sans-serif" font-size="13" font-weight="700" fill="#f4ede1">南山台地 · 微气候</text>
        <text x="15" y="60" font-family="PingFang SC, sans-serif" font-size="11" fill="#a58667">海拔/土壤/温湿度/养料</text>
        <rect x="15" y="75" width="160" height="18" rx="4" fill="#2d1c13"/>
        <text x="25" y="88" font-family="monospace" font-size="10" fill="#e5a93c">匹配度 97.0 / 100分</text>
      </g>

      <!-- 连接箭头 1 -->
      <path d="M 200 55 L 215 55" stroke="#aa7c11" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- Step 2: 物理开核 -->
      <g transform="translate(220, 0)">
        <rect width="190" height="110" rx="12" fill="#1a110c" stroke="#5f412d" stroke-width="1"/>
        <text x="15" y="30" font-size="18">🔨</text>
        <text x="42" y="30" font-family="PingFang SC, sans-serif" font-size="13" font-weight="700" fill="#f4ede1">解石工坊 · 破青皮</text>
        <text x="15" y="60" font-family="PingFang SC, sans-serif" font-size="11" fill="#a58667">小铜锤/文玩夹/银挑针</text>
        <rect x="15" y="75" width="160" height="18" rx="4" fill="#382115"/>
        <text x="25" y="88" font-family="monospace" font-size="10" fill="#4ade80">极品 · 五棱 (保底触发)</text>
      </g>

      <!-- Step 3: 五维配对 -->
      <g transform="translate(0, 130)">
        <rect width="190" height="115" rx="12" fill="#1a110c" stroke="#aa7c11" stroke-width="1.2"/>
        <text x="15" y="30" font-size="18">📦</text>
        <text x="42" y="30" font-family="PingFang SC, sans-serif" font-size="13" font-weight="700" fill="#f4ede1">文玩配对 · 锦盒</text>
        <text x="15" y="60" font-family="PingFang SC, sans-serif" font-size="11" fill="#a58667">尺寸/桩型/纹路/皮质/棱数</text>
        <rect x="15" y="78" width="160" height="20" rx="4" fill="#422513"/>
        <text x="25" y="92" font-family="PingFang SC, sans-serif" font-size="10" font-weight="700" fill="#fbbf24">配对度 98% 天造地设 (4x)</text>
      </g>

      <!-- 连接箭头 2 -->
      <path d="M 200 185 L 215 185" stroke="#aa7c11" stroke-width="2"/>

      <!-- Step 4: 易宝入私博 -->
      <g transform="translate(220, 130)">
        <rect width="190" height="115" rx="12" fill="#1a110c" stroke="#aa7c11" stroke-width="1.2"/>
        <text x="15" y="30" font-size="18">🏛️</text>
        <text x="42" y="30" font-family="PingFang SC, sans-serif" font-size="13" font-weight="700" fill="#f4ede1">传世私博 · 镇馆</text>
        <text x="15" y="60" font-family="PingFang SC, sans-serif" font-size="11" fill="#a58667">越王古剑 / 快雪时晴帖</text>
        <rect x="15" y="78" width="160" height="20" rx="4" fill="#301f14"/>
        <text x="25" y="92" font-family="PingFang SC, sans-serif" font-size="10" font-weight="700" fill="#f87171">迎回国宝 · 馆藏大成</text>
      </g>
    </g>

    <!-- 卡片底部手写注记 -->
    <text x="435" y="335" text-anchor="end" font-family="Georgia, serif" font-style="italic" font-size="14" fill="#aa7c11">
      Make every walnut a national treasure.
    </text>
  </g>

  <!-- 底部核心循环跑道 -->
  <g transform="translate(60, 480)">
    <rect width="1080" height="85" rx="14" fill="#1f140e" stroke="#5f412d" stroke-width="1"/>
    
    <g transform="translate(30, 26)">
      <!-- 循环步骤 1 -->
      <text x="0" y="24" font-size="20">🌾</text>
      <text x="32" y="16" font-family="PingFang SC, sans-serif" font-size="13" font-weight="700" fill="#f4ede1">① 选地育种</text>
      <text x="32" y="34" font-family="PingFang SC, sans-serif" font-size="11" fill="#a58667">海拔/水土/24节气</text>

      <!-- 箭头 -->
      <text x="165" y="25" font-family="-apple-system, sans-serif" font-size="18" fill="#5f412d">→</text>

      <!-- 循环步骤 2 -->
      <text x="200" y="24" font-size="20">🔨</text>
      <text x="232" y="16" font-family="PingFang SC, sans-serif" font-size="13" font-weight="700" fill="#f4ede1">② 亲手开核</text>
      <text x="232" y="34" font-family="PingFang SC, sans-serif" font-size="11" fill="#a58667">敲夹撬/剥青皮</text>

      <text x="365" y="25" font-family="-apple-system, sans-serif" font-size="18" fill="#5f412d">→</text>

      <!-- 循环步骤 3 -->
      <text x="400" y="24" font-size="20">📜</text>
      <text x="432" y="16" font-family="PingFang SC, sans-serif" font-size="13" font-weight="700" fill="#f4ede1">③ 鉴定配对</text>
      <text x="432" y="34" font-family="PingFang SC, sans-serif" font-size="11" fill="#a58667">五维成双/红木锦盒</text>

      <text x="575" y="25" font-family="-apple-system, sans-serif" font-size="18" fill="#5f412d">→</text>

      <!-- 循环步骤 4 -->
      <text x="610" y="24" font-size="20">🏺</text>
      <text x="642" y="16" font-family="PingFang SC, sans-serif" font-size="13" font-weight="700" fill="#f4ede1">④ 名士易宝</text>
      <text x="642" y="34" font-family="PingFang SC, sans-serif" font-size="11" fill="#a58667">换取名剑古画瓷器</text>

      <text x="775" y="25" font-family="-apple-system, sans-serif" font-size="18" fill="#5f412d">→</text>

      <!-- 循环步骤 5 -->
      <text x="810" y="24" font-size="20">🏛️</text>
      <text x="842" y="16" font-family="PingFang SC, sans-serif" font-size="13" font-weight="700" fill="#f4ede1">⑤ 兴建私博</text>
      <text x="842" y="34" font-family="PingFang SC, sans-serif" font-size="11" fill="#e5a93c">镇馆之位/周联赛评比</text>
    </g>
  </g>
</svg>
